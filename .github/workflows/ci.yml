name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # addendum §2: off = the owner role (as every clone runs today); enforce = app_rw, NOBYPASSRLS. RLS is opt-in (D-23;
        # owner decision 2026-11-05): a clone runs the enforce leg once it sets the repo variable RLS_ENFORCE=1. The template always runs both.
        rls: ${{ fromJSON((github.repository == 'shanelabountyai/saas-foundation' || vars.RLS_ENFORCE == '1') && '["off","enforce"]' || '["off"]') }}
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truckroll_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/truckroll_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:7800
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb truckroll_test
      - run: npx prisma migrate deploy
      # Truckroll D-24: the clone's hand-written migrations must produce exactly prisma/schema (exit 2 = they differ).
      - name: Migrations match the schema
        if: matrix.rls == 'off'
        run: |
          createdb truckroll_shadow
          SHADOW_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/truckroll_shadow npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema --exit-code
      - name: RLS enforce leg — app role, system URL
        if: matrix.rls == 'enforce'
        run: |
          db=${DATABASE_URL%%\?*}; db=${db##*/} # the job's own test DB name, so a clone's rename needs no edit here (F-14)
          psql -d "$db" -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOBYPASSRLS NOSUPERUSER;"
          psql -d "$db" -c "GRANT USAGE ON SCHEMA public TO app_rw; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rw; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rw;"
          echo "RLS_MODE=enforce" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYSTEM=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_rw:app_rw@localhost:5432/$db?connection_limit=8&pool_timeout=20" >> "$GITHUB_ENV"
      - run: npx vitest run
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      # Truckroll: e2e/dispatch.spec.ts plans a day through the real solver service (PRD §5), started here on :7801.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - name: Start the solver service
        working-directory: solver
        run: |
          python -m venv .venv && .venv/bin/pip install -q -e .
          nohup .venv/bin/uvicorn app:app --host 127.0.0.1 --port 7801 > "$RUNNER_TEMP/solver.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7801/health && exit 0; sleep 1; done; cat "$RUNNER_TEMP/solver.log"; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          SOLVER_URL: http://127.0.0.1:7801

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules

  # Truckroll Phase 1 (clone-owned): the Python solver, the cross-language tests that need it, and the p95 bench.
  solver:
    runs-on: ubuntu-latest
    env:
      TRUCKROLL_SOLVER_PYTHON: ${{ github.workspace }}/solver/.venv/bin/python
      TRUCKROLL_REQUIRE_SOLVER: '1' # the solver-dependent vitest files fail here instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install solver (pinned in solver/pyproject.toml)
        working-directory: solver
        run: python -m venv .venv && .venv/bin/pip install -e '.[test]'
      - name: pytest
        working-directory: solver
        run: .venv/bin/python -m pytest -q
      - run: npm ci
      # The solver-dependent files only: they need no database, so vitest runs without .env.test. The rest of
      # tests/truckroll (TR-02, TR-05, actions) needs Postgres and runs in the ci job.
      - run: npx vitest run tests/truckroll/cross-language.test.ts tests/truckroll/tr-01-skills.test.ts tests/truckroll/tr-04-determinism.test.ts
      - name: Solver p95 per fixture (gate < 2000 ms)
        working-directory: solver
        run: .venv/bin/python bench.py 20
